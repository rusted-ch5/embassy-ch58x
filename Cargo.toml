[package]
name = "embassy-ch58x"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Embassy async runtime support for WCH CH58x microcontrollers"
repository = "https://github.com/rusted-ch5/embassy-ch58x"
homepage = "https://github.com/rusted-ch5/embassy-ch58x"
license = "MIT OR Apache-2.0"
keywords = ["wch", "qingke", "embassy", "async", "no-std"]
categories = ["embedded", "no-std", "asynchronous", "hardware-support"]

[features]
default = ["ch582"]
ch582 = ["ch58x-hal/ch582", "qingke/v4", "qingke-rt/v4"]
ch585 = ["ch58x-hal/ch585", "qingke/v3", "qingke-rt/ch585-v3c"]

[dependencies]
ch58x-hal = { git = "https://github.com/rusted-ch5/ch58x-hal.git", rev = "e57bd7d8b2ea94fad5c41d3d034e059221b72bca", default-features = false }
embassy-executor = { version = "0.9", features = ["arch-spin", "executor-thread"] }
qingke = { version = "0.6.1", default-features = false }
qingke-rt = { git = "https://github.com/rusted-ch5/qingke-rs.git", rev = "b107f8b4cce3495ff807738cdbb34f25819ca680", default-features = false, features = ["highcode"] }

[workspace]
